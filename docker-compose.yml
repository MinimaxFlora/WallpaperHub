# Wallpaper API stack: a Caddy container terminates TLS and reverse-proxies to
# the API container, which never binds a public port itself.
services:
  caddy:
    image: caddy:2-alpine
    container_name: wallpaper-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Site address for the Caddyfile, for example wallpaper.example.com.
      WALLPAPER_DOMAIN: ${WALLPAPER_DOMAIN:-localhost}
    volumes:
      # Override with WALLPAPER_CADDYFILE to point at a host-specific Caddyfile.
      - ${WALLPAPER_CADDYFILE:-./deploy/caddy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - wallpaper-api

  wallpaper-api:
    build: .
    image: wallpaper-api:latest
    container_name: wallpaper-api
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      # Image bytes fetched from GitHub are cached here.
      - cache:/data/cache
    environment:
      # Wallpapers live in a GitHub repository; the service reads the committed
      # manifest and caches image bytes on first request.
      WALLPAPER_SOURCE: github
      WALLPAPER_GITHUB_REPO: MinimaxFlora/WallpaperHub
      WALLPAPER_GITHUB_REF: master
      # Optional token to raise the GitHub rate limit or read a private repo.
      WALLPAPER_GITHUB_TOKEN: ""
      WALLPAPER_MANIFEST_REFRESH_INTERVAL: 15m
      WALLPAPER_CACHE_DIR: /data/cache
      # For a local checkout instead, set WALLPAPER_SOURCE: local and mount the
      # repository read-only at /data/repo with WALLPAPER_ROOT: /data/repo.
      WALLPAPER_ADDR: ":8080"
      # Public URL used to build absolute links. Leave empty to derive from the
      # request's forwarded headers.
      WALLPAPER_BASE_URL: ${WALLPAPER_BASE_URL:-}
      WALLPAPER_TIMEZONE: Asia/Shanghai
      WALLPAPER_RATELIMIT_LIMIT: "120"
      WALLPAPER_RATELIMIT_WINDOW: 1m
      # Comma-separated origins allowed to fetch image bytes; empty allows all.
      # Example: "example.com,*.example.com"
      WALLPAPER_HOTLINK_ALLOWLIST: ""
      WALLPAPER_LOG_LEVEL: info

volumes:
  caddy_data:
  caddy_config:
  cache:
